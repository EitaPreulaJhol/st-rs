# Run the test suite on every push and pull request.
#
# - unit: the Rust unit tests on the host (fast feedback).
# - e2e:  the full suite from `make test`, inside the Docker test image with
#         a private Xvfb display (rendering, keys, scrollback, search, ...).

name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxft-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --locked

      - name: Unit tests
        run: cargo test --release --locked

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: End-to-end tests (Docker, Xvfb)
        run: make test
