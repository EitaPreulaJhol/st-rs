# Build st-rs and publish a GitHub release when a version tag is pushed.
#
#   git tag -a v0.10.0 -m "st-rs 0.10.0" -m "<release notes>"
#   git push origin v0.10.0
#
# The release notes are taken from the annotated tag's message.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    # The oldest supported Ubuntu runner, so the binary runs on systems with
    # an older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          # Annotated tags are needed for --notes-from-tag.
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxft-dev libfontconfig1-dev libfreetype6-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || {
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          }
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Unit tests
        run: cargo test --release --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="st-rs-$VERSION-linux-x86_64"
          mkdir -p "dist/$name"
          cp target/release/st "dist/$name/"
          strip "dist/$name/st"
          sed "s/VERSION/$VERSION/g" st.1 > "dist/$name/st.1"
          cp st.info README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "ASSET=dist/$name.tar.gz" >> "$GITHUB_ENV"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "st-rs $VERSION" \
            --notes-from-tag \
            "$ASSET" "$ASSET.sha256"
